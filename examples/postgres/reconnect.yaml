version: 1
name: custom-reconnect
targets: [direct, shared, dedicated]
workload: custom-sql
sql_file: custom.sql
seed: 42
protocol: simple
connection_mode: reconnect
concurrency: [1, 2, 4]
warmup: 2s
duration: 10s
thresholds:
  max_p95_ms: 250
  max_error_rate: 0
  min_tps: 1
  max_connection_mean_ms: 1000
